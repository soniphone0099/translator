<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phiên Dịch Trên Kính</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        #touchOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            cursor: pointer;
        }
        #touchBtn {
            background-color: #00ffcc;
            color: #000;
            border: none;
            padding: 20px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
        }
        #transcript {
            width: 100%;
            max-width: 500px;
            height: 250px;
            background-color: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 16px;
            font-size: 22px;
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.5;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .translated {
            color: #00ffcc;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Lớp phủ bắt buộc chạm 1 lần để mở khóa micro trên kính -->
    <div id="touchOverlay" onclick="startApp()">
        <button id="touchBtn">Chạm vào đây để Bắt Đầu</button>
        <p style="color: #888; margin-top: 15px; font-size: 14px;">(Yêu cầu tương tác 1 lần để bật micro)</p>
    </div>

    <div id="transcript">
        <div class="translated">Đang chờ kích hoạt...</div>
    </div>

    <script>
        const transcriptDiv = document.getElementById('transcript');
        const touchOverlay = document.getElementById('touchOverlay');
        let recognition = null;
        let isRunning = false;
        let lastSpokenText = "";

        function startApp() {
            // Ẩn lớp nút bấm đi sau khi chạm
            touchOverlay.style.display = 'none';
            isRunning = true;
            initSpeech();
        }

        function initSpeech() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                transcriptDiv.innerHTML = "<div class='translated'>Trình duyệt của kính không hỗ trợ nhận diện giọng nói.</div>";
                return;
            }

            if (recognition) {
                try { recognition.stop(); } catch(e) {}
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'en-US'; // Ngôn ngữ nguồn cần nghe (Tiếng Anh)
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onstart = function() {
                transcriptDiv.innerHTML = "<div class='translated'>Đang lắng nghe trực tiếp...</div>";
            };

            recognition.onresult = async function(event) {
                let finalText = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalText += event.results[i][0].transcript;
                    }
                }

                if (finalText.trim()) {
                    let translatedText = await translateToVietnamese(finalText);
                    
                    // Hiển thị tiếng Việt lên màn hình kính
                    transcriptDiv.innerHTML = `<div class="translated">${translatedText}</div>`;

                    // Phát âm thanh giọng nữ tiếng Việt chuẩn Google
                    playGoogleFemaleVoice(translatedText);
                }
            };

            recognition.onerror = function(event) {
                console.log("Lỗi micro: ", event.error);
            };

            recognition.onend = function() {
                if (isRunning) {
                    // Tự động kết nối lại ngay lập tức khi micro ngắt quãng
                    setTimeout(() => {
                        try { recognition.start(); } catch (e) {}
                    }, 300);
                }
            };

            try {
                recognition.start();
            } catch (e) {
                transcriptDiv.innerHTML = "<div class='translated'>Không thể khởi động micro: " + e.message + "</div>";
            }
        }

        async function translateToVietnamese(text) {
            try {
                let url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=vi&dt=t&q=` + encodeURIComponent(text);
                let response = await fetch(url);
                let data = await response.json();
                return data[0].map(item => item[0]).join('');
            } catch (error) {
                return text;
            }
        }

        function playGoogleFemaleVoice(text) {
            if (text === lastSpokenText) return;
            lastSpokenText = text;

            let audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=` + encodeURIComponent(text) + `&tl=vi&client=tw-ob`;
            let audio = new Audio(audioUrl);
            audio.play().catch(e => {});
        }
    </script>
</body>
</html>

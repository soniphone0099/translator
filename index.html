<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phiên Dịch Bằng Bàn Phím Cho Kính</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        #inputContainer {
            margin-bottom: 20px;
            width: 100%;
            max-width: 500px;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #111;
            color: #fff;
            box-sizing: border-box;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #00ffcc;
        }
        #transcript {
            width: 100%;
            max-width: 500px;
            min-height: 180px;
            background-color: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 16px;
            font-size: 24px;
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.5;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .translated {
            color: #00ffcc;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="inputContainer">
        <input type="text" id="textInput" placeholder="Nhập từ/câu cần dịch và bấm Enter..." autofocus onkeydown="checkEnter(event)">
    </div>

    <div id="transcript">
        <div class="translated">Đang chờ nhập nội dung...</div>
    </div>

    <script>
        const transcriptDiv = document.getElementById('transcript');
        const textInput = document.getElementById('textInput');
        let lastSpokenText = "";

        // Bắt sự kiện bấm phím Enter để dịch ngay lập tức
        function checkEnter(event) {
            if (event.key === 'Enter') {
                let text = textInput.value.trim();
                if (text) {
                    processTranslation(text);
                    textInput.value = ''; // Xóa ô nhập sau khi gửi
                }
            }
        }

        // Hàm dịch và phát âm thanh
        async function processTranslation(inputText) {
            transcriptDiv.innerHTML = `<div class="translated">Đang dịch...</div>`;
            
            let translatedText = await translateToVietnamese(inputText);
            
            // Hiển thị kết quả tiếng Việt lên màn hình kính
            transcriptDiv.innerHTML = `<div class="translated">${translatedText}</div>`;

            // Phát âm thanh giọng nữ tiếng Việt chuẩn Google
            playGoogleFemaleVoice(translatedText);
        }

        // Gọi Google Translate API để dịch tự động sang tiếng Việt
        async function translateToVietnamese(text) {
            try {
                let url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=vi&dt=t&q=` + encodeURIComponent(text);
                let response = await fetch(url);
                let data = await response.json();
                return data[0].map(item => item[0]).join('');
            } catch (error) {
                return text;
            }
        }

        // Phát âm thanh chuẩn giọng nữ tiếng Việt
        function playGoogleFemaleVoice(text) {
            if (text === lastSpokenText) return;
            lastSpokenText = text;

            let audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=` + encodeURIComponent(text) + `&tl=vi&client=tw-ob`;
            let audio = new Audio(audioUrl);
            audio.play().catch(e => console.log("Không phát được âm thanh: ", e));
        }
    </script>
</body>
</html>

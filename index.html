<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phiên Dịch Trực Tiếp Cho Kính</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        h2 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #00ffcc;
            text-align: center;
        }
        #transcript {
            flex: 1;
            background-color: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h2>Đang Phiên Dịch Trực Tiếp...</h2>
    <div id="transcript">Đang lắng nghe âm thanh để dịch...</div>

    <script>
        // Tự động kích hoạt nhận diện giọng nói và dịch ngay khi mở trang
        const transcriptDiv = document.getElementById('transcript');

        function startAutoTranslate() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                transcriptDiv.innerText = "Trình duyệt của kính không hỗ trợ nhận diện giọng nói.";
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US'; // Ngôn ngữ nguồn cần dịch (ví dụ: Tiếng Anh)
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onstart = function() {
                transcriptDiv.innerText = "Đang nghe... (Hãy nói để dịch)";
            };

            recognition.onresult = function(event) {
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                if (finalTranscript) {
                    transcriptDiv.innerText = "Dịch: " + finalTranscript;
                }
            };

            recognition.onerror = function(event) {
                transcriptDiv.innerText = "Lỗi: " + event.error + ". Đang thử kết nối lại...";
                setTimeout(() => recognition.start(), 1000);
            };

            recognition.onend = function() {
                // Tự động khởi động lại nếu ngắt quãng để dịch liên tục không cần bấm nút
                recognition.start();
            };

            recognition.start();
        }

        // Chạy ngay khi tải xong trang
        window.addEventListener('DOMContentLoaded', () => {
            startAutoTranslate();
        });
    </script>
</body>
</html>

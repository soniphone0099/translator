<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phiên Dịch Tiếng Việt Trên Máy Tính</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        #startBtn {
            background-color: #00ffcc;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        #transcript {
            width: 100%;
            max-width: 500px;
            height: 220px;
            background-color: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 16px;
            font-size: 22px;
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.5;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .translated {
            color: #00ffcc;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <button id="startBtn" onclick="initSpeech()">Bấm để Bắt Đầu Dịch</button>
    <div id="transcript">
        <div class="translated">Đang chờ bật phiên dịch...</div>
    </div>

    <script>
        const transcriptDiv = document.getElementById('transcript');
        const startBtn = document.getElementById('startBtn');
        let recognition = null;
        let isRunning = false;
        let lastSpokenText = "";
        let voices = [];

        // Tải sẵn danh sách giọng đọc của trình duyệt máy tính
        function loadVoices() {
            if (window.speechSynthesis) {
                voices = window.speechSynthesis.getVoices();
            }
        }
        if (window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
            loadVoices();
        }

        function initSpeech() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                transcriptDiv.innerHTML = "<div class='translated'>Trình duyệt máy tính không hỗ trợ nhận diện giọng nói.</div>";
                return;
            }

            if (recognition) {
                try { recognition.stop(); } catch(e) {}
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'en-US'; // Ngôn ngữ nguồn cần nghe (Ví dụ: Tiếng Anh)
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onstart = function() {
                isRunning = true;
                startBtn.style.display = 'none';
                transcriptDiv.innerHTML = "<div class='translated'>Đang lắng nghe trên máy tính...</div>";
            };

            recognition.onresult = async function(event) {
                let finalText = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalText += event.results[i][0].transcript;
                    }
                }

                if (finalText.trim()) {
                    let translatedText = await translateToVietnamese(finalText);
                    
                    // Hiển thị tiếng Việt lên màn hình
                    transcriptDiv.innerHTML = `<div class="translated">${translatedText}</div>`;

                    // Đọc bằng giọng tiếng Việt chuẩn của máy tính
                    speakVietnamese(translatedText);
                }
            };

            recognition.onerror = function(event) {
                if (event.error === 'aborted' || event.error === 'no-speech') {
                    return;
                }
            };

            recognition.onend = function() {
                if (isRunning) {
                    setTimeout(() => {
                        try { recognition.start(); } catch (e) { setTimeout(initSpeech, 1000); }
                    }, 300);
                }
            };

            try {
                recognition.start();
            } catch (e) {}
        }

        // Hàm dịch sang tiếng Việt
        async function translateToVietnamese(text) {
            try {
                let url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=vi&dt=t&q=` + encodeURIComponent(text);
                let response = await fetch(url);
                let data = await response.json();
                let translation = data[0].map(item => item[0]).join('');
                return translation;
            } catch (error) {
                return text;
            }
        }

        // Hàm phát âm thanh Tiếng Việt chuẩn trên máy tính
        function speakVietnamese(text) {
            if (!window.speechSynthesis) return;
            if (text === lastSpokenText) return;
            lastSpokenText = text;

            window.speechSynthesis.cancel(); // Dừng câu cũ

            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'vi-VN';
            utterance.rate = 1.0;

            // Tìm chính xác giọng tiếng Việt trên Windows/Mac của bạn
            if (voices.length === 0) {
                voices = window.speechSynthesis.getVoices();
            }
            let viVoice = voices.find(v => v.lang === 'vi-VN' || v.lang.toLowerCase().includes('vi'));
            if (viVoice) {
                utterance.voice = viVoice;
            }

            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phiên Dịch Giọng Nữ Tiếng Việt</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        #transcript {
            width: 100%;
            max-width: 500px;
            height: 250px;
            background-color: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 16px;
            font-size: 22px;
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.5;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .translated {
            color: #00ffcc;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="transcript">
        <div class="translated">Đang khởi động phiên dịch giọng nữ...</div>
    </div>

    <script>
        const transcriptDiv = document.getElementById('transcript');
        let recognition = null;
        let isRunning = true;
        let lastSpokenText = "";
        let voices = [];

        // Tải danh sách giọng đọc của trình duyệt
        function loadVoices() {
            if (window.speechSynthesis) {
                voices = window.speechSynthesis.getVoices();
            }
        }
        if (window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
            loadVoices();
        }

        // Tự động chạy ngay khi mở trang
        window.addEventListener('DOMContentLoaded', () => {
            initAutoSpeech();
        });

        function initAutoSpeech() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                transcriptDiv.innerHTML = "<div class='translated'>Trình duyệt không hỗ trợ nhận diện giọng nói.</div>";
                return;
            }

            if (recognition) {
                try { recognition.stop(); } catch(e) {}
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'en-US'; // Ngôn ngữ nguồn cần nghe (Tiếng Anh)
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onstart = function() {
                transcriptDiv.innerHTML = "<div class='translated'>Đang lắng nghe trực tiếp...</div>";
            };

            recognition.onresult = async function(event) {
                let finalText = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalText += event.results[i][0].transcript;
                    }
                }

                if (finalText.trim()) {
                    let translatedText = await translateToVietnamese(finalText);
                    
                    // Hiển thị tiếng Việt lên màn hình
                    transcriptDiv.innerHTML = `<div class="translated">${translatedText}</div>`;

                    // Đọc bằng giọng nữ tiếng Việt
                    speakVietnameseFemale(translatedText);
                }
            };

            recognition.onerror = function(event) {
                if (event.error === 'not-allowed') {
                    transcriptDiv.innerHTML = "<div class='translated'>Vui lòng chạm vào màn hình để cấp quyền micro.</div>";
                }
            };

            recognition.onend = function() {
                if (isRunning) {
                    setTimeout(() => {
                        try { recognition.start(); } catch (e) { setTimeout(initAutoSpeech, 1000); }
                    }, 300);
                }
            };

            try {
                recognition.start();
            } catch (e) {
                window.addEventListener('click', () => {
                    try { recognition.start(); } catch (err) {}
                }, { once: true });
            }
        }

        // Hàm dịch sang tiếng Việt qua Google API
        async function translateToVietnamese(text) {
            try {
                let url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=vi&dt=t&q=` + encodeURIComponent(text);
                let response = await fetch(url);
                let data = await response.json();
                let translation = data[0].map(item => item[0]).join('');
                return translation;
            } catch (error) {
                return text;
            }
        }

        // Hàm chọn và đọc bằng giọng nữ tiếng Việt
        function speakVietnameseFemale(text) {
            if (!window.speechSynthesis) return;
            if (text === lastSpokenText) return;
            lastSpokenText = text;

            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'vi-VN';
            utterance.rate = 1.0;

            if (voices.length === 0) {
                voices = window.speechSynthesis.getVoices();
            }

            // Lọc các giọng tiếng Việt có sẵn
            let viVoices = voices.filter(v => v.lang === 'vi-VN' || v.lang.toLowerCase().includes('vi'));
            
            // Ưu tiên tìm giọng nữ (thường chứa từ khóa như female, nữ, hoaimy, chi, v.v.)
            let femaleVoice = viVoices.find(v => {
                let name = v.name.toLowerCase();
                return name.includes('female') || name.includes('nữ') || name.includes('hoaimy') || name.includes('chi') || name.includes('An');
            });

            // Nếu tìm thấy giọng nữ thì gán vào, nếu không lấy giọng tiếng Việt đầu tiên
            if (femaleVoice) {
                utterance.voice = femaleVoice;
            } else if (viVoices.length > 0) {
                utterance.voice = viVoices[0];
            }

            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phiên Dịch HUD Cho Kính</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .hud-container {
            width: 100vw;
            max-width: 600px;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        h2 {
            font-size: 16px;
            color: #00ffcc;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            opacity: 0.6;
        }
        #transcript {
            font-size: 42px; 
            font-weight: bold;
            line-height: 1.4;
            color: #00ff00; 
            text-shadow: 0 0 12px rgba(0, 255, 0, 0.6);
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <div class="hud-container">
        <h2>• LIVE TRANSLATE •</h2>
        <div id="transcript">Đang kết nối micro...</div>
    </div>

    <script>
        const transcriptDiv = document.getElementById('transcript');
        let recognition;
        let isListening = false;

        function initSpeech() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                transcriptDiv.innerText = "Trình duyệt không hỗ trợ nhận diện giọng nói.";
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.continuous = false; // Đổi thành false để tránh lỗi nghẽn buffer trên một số trình duyệt
            recognition.interimResults = true;

            recognition.onstart = function() {
                isListening = true;
                if (transcriptDiv.innerText === "Đang kết nối micro..." || transcriptDiv.innerText.includes("Lỗi")) {
                    transcriptDiv.style.color = "#888888";
                    transcriptDiv.style.textShadow = "none";
                    transcriptDiv.innerText = "Listening... 🎙️";
                }
            };

            recognition.onresult = function(event) {
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                if (interimTranscript) {
                    transcriptDiv.style.color = "#888888";
                    transcriptDiv.style.textShadow = "none";
                    transcriptDiv.innerText = interimTranscript;
                }

                if (finalTranscript) {
                    fetchTranslation(finalTranscript);
                }
            };

            async function fetchTranslation(text) {
                try {
                    const res = await fetch(`https://translated.net{encodeURIComponent(text)}&langpair=en|vi`);
                    const data = await res.json();
                    transcriptDiv.style.color = "#00ff00";
                    transcriptDiv.style.textShadow = "0 0 12px rgba(0, 255, 0, 0.6)";
                    transcriptDiv.innerText = data.responseData.translatedText;
                } catch (error) {
                    console.log("Lỗi dịch thuật");
                }
            }

            recognition.onerror = function(event) {
                console.log("Speech error:", event.error);
                // Nếu bị hủy (aborted) hoặc không nghe thấy (no-speech), ép hệ thống chạy lại ngay
                if (event.error === 'aborted' || event.error === 'no-speech') {
                    isListening = false;
                }
            };

            recognition.onend = function() {
                isListening = false;
                // Tự động kích hoạt lại sau 300ms bất kể lý do tắt là gì
                setTimeout(() => {
                    if (!isListening) {
                        try { recognition.start(); } catch(e) {}
                    }
                }, 300);
            };

            try { recognition.start(); } catch(e) {}
        }

        window.addEventListener('DOMContentLoaded', initSpeech);
    </script>
</body>
</html>

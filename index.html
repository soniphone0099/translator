<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chẩn Đoán Lỗi Trên Kính</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        #transcript {
            width: 100%;
            max-width: 500px;
            height: 250px;
            background-color: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 16px;
            font-size: 20px;
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.5;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .translated {
            color: #ff3333;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="transcript">
        <div id="status" class="translated">Đang kiểm tra trình duyệt của kính...</div>
    </div>

    <script>
        const statusDiv = document.getElementById('status');
        let recognition = null;
        let isRunning = true;

        window.addEventListener('DOMContentLoaded', () => {
            initAutoSpeech();
        });

        function initAutoSpeech() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            // Kiểm tra xem trình duyệt trên kính có hỗ trợ nhận diện giọng nói không
            if (!SpeechRecognition) {
                statusDiv.innerText = "Lỗi: Trình duyệt của kính KHÔNG hỗ trợ Web Speech API!";
                return;
            }

            try {
                recognition = new SpeechRecognition();
                recognition.lang = 'en-US';
                recognition.continuous = true;
                recognition.interimResults = true;

                recognition.onstart = function() {
                    statusDiv.style.color = "#00ffcc";
                    statusDiv.innerText = "Đang kết nối micro thành công trên kính. Hãy nói thử...";
                };

                recognition.onresult = async function(event) {
                    let finalText = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) {
                            finalText += event.results[i][0].transcript;
                        }
                    }

                    if (finalText.trim()) {
                        let translatedText = await translateToVietnamese(finalText);
                        statusDiv.style.color = "#00ffcc";
                        statusDiv.innerText = translatedText;
                        playGoogleFemaleVoice(translatedText);
                    }
                };

                recognition.onerror = function(event) {
                    // Hiển thị chính xác lỗi mà kính đang gặp phải lên màn hình
                    statusDiv.style.color = "#ff3333";
                    statusDiv.innerText = "Lỗi từ kính: " + event.error;
                };

                recognition.onend = function() {
                    if (isRunning) {
                        setTimeout(() => {
                            try { recognition.start(); } catch (e) {}
                        }, 1000);
                    }
                };

                recognition.start();

            } catch (e) {
                statusDiv.innerText = "Lỗi khởi tạo: " + e.message;
            }
        }

        async function translateToVietnamese(text) {
            try {
                let url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=vi&dt=t&q=` + encodeURIComponent(text);
                let response = await fetch(url);
                let data = await response.json();
                return data[0].map(item => item[0]).join('');
            } catch (error) {
                return text;
            }
        }

        function playGoogleFemaleVoice(text) {
            let audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=` + encodeURIComponent(text) + `&tl=vi&client=tw-ob`;
            let audio = new Audio(audioUrl);
            audio.play().catch(e => {});
        }
    </script>
</body>
</html>
